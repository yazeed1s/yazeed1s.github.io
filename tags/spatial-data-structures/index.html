    <script>
        (() => {
            const root = document.documentElement;
            const system = matchMedia('(prefers-color-scheme: dark)');
            let preference;
            try { preference = localStorage.getItem('theme'); } catch (_) {}
            if (preference !== 'light' && preference !== 'dark') preference = null;
            function apply() {
                const theme = preference || (system.matches ? 'dark' : 'light');
                if (preference) root.dataset.theme = preference;
                else delete root.dataset.theme;
                document.getElementById('syntax-light').media = theme === 'light' ? 'all' : 'not all';
                document.getElementById('syntax-dark').media = theme === 'dark' ? 'all' : 'not all';
                document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
                    meta.content = getComputedStyle(root).getPropertyValue('--background').trim();
                });
                const button = document.getElementById('theme-toggle');
                if (button) {
                    button.hidden = false;
                    button.setAttribute('aria-pressed', String(theme === 'dark'));
                }
            }
            apply();
            system.addEventListener('change', apply);
            document.addEventListener('DOMContentLoaded', () => {
                apply();
                document.getElementById('theme-toggle').addEventListener('click', () => {
                    preference = (preference || (system.matches ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark';
                    try { localStorage.setItem('theme', preference); } catch (_) {}
                    apply();
                });
            });
        })();
    </script>
