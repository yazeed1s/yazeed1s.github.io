title = "Yazeed's Blog"
description = "Notes on systems and low-level software."
base_url = "https://yazeed1s.github.io"
compile_sass = false
build_search_index = false
default_language = "en"
taxonomies = [{ name = "tags", feed = true }]

[markdown]
[markdown.highlighting]
style = "class"
extra_themes = [
  "themes/zenburn-custom-dark.json",
  "themes/zenburn-custom-light.json",
]
# light_theme = "Gruvbox Material Light"
# dark_theme = "Gruvbox Material Dark"
light_theme = "Zenburn Custom Light"
dark_theme = "Zenburn Custom Dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
# SEO
keywords = "yazeed, blog, alharthi, yaz, yazeed1s"
# site_icon = "quill.svg"
# strapline = "#"
# footer_text = "austere - made for <a href='https://getzola.org'>Zola</a>"
favicon = "/favicon.ico"
# profile_picture = "/images/profile.svg"
recent_posts_count = 5

inline_icons = true
icon_path = "static/icons/"
icons = ["light", "asleep", "rss"]

image_format = "auto"
image_quality = 100
images_default_size = 1024
images_sizes = [512, 1024, 2048]

# menu.
menu_links = [
  { url = "$BASE_URL/", name = "Home" },
  { url = "$BASE_URL/posts/", name = "Posts" },
  # { url = "$BASE_URL/about/", name = "About" },
  { url = "$BASE_URL/projects/", name = "Projects" },
  { url = "$BASE_URL/tags/", name = "Tags" },
  # { url = "$BASE_URL/search/", name = "Search" },
]


[extra.colours.light]
background = "#eef0f0"
text_heading = "#1b1e21"
body_text = "#444a4e"
text_muted = "#757c82"
heading_mark = "#a9b4b8"
accent = "#c97d4a"
bold = "#14171a"
italic = "#4a5155"
accent_hover = "#a3623a"
code_bg = "#e6e8e6"
border = "#d2d5d6"

[extra.colours.dark]
background = "#111214ff"
text_heading = "#e7e9ea"
body_text = "#d6dcddff"
text_muted = "#8b9198"
heading_mark = "#5c6368"
accent = "#e39c6f"
bold = "#f1f2f2"
italic = "#b9bec1"
accent_hover = "#eeb389"
code_bg = "#292e32"
border = "#2c3033"
