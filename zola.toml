title = "Yazeed's Blog"
description = "Notes on systems and low-level software."
base_url = "https://yazeed1s.github.io"
compile_sass = false
build_search_index = false
default_language = "en"
taxonomies = [{ name = "tags", feed = true }]

[markdown]
[markdown.highlighting]
style = "class"
extra_themes = [
  "themes/technical-journal-dark.json",
  "themes/technical-journal-light.json",
]
# light_theme = "Gruvbox Material Light"
# dark_theme = "Gruvbox Material Dark"
light_theme = "Technical Journal Light"
dark_theme = "Technical Journal Dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
# SEO
keywords = "yazeed, blog, alharthi, yaz, yazeed1s"
# site_icon = "quill.svg"
# strapline = "#"
# footer_text = "austere - made for <a href='https://getzola.org'>Zola</a>"
favicon = "/favicon.ico"
# profile_picture = "/images/profile.svg"
recent_posts_count = 5

inline_icons = true
icon_path = "static/icons/"
icons = ["light", "asleep", "rss"]

image_format = "auto"
image_quality = 100
images_default_size = 1024
images_sizes = [512, 1024, 2048]

# menu.
menu_links = [
  { url = "$BASE_URL/", name = "Home" },
  { url = "$BASE_URL/posts/", name = "Posts" },
  # { url = "$BASE_URL/about/", name = "About" },
  { url = "$BASE_URL/projects/", name = "Projects" },
  { url = "$BASE_URL/tags/", name = "Tags" },
  # { url = "$BASE_URL/search/", name = "Search" },
]


# Page palettes. Syntax colours are configured under markdown.highlighting.
[extra.colours.light]
background = "#f5f5f3"
text_heading = "#20242a"
body_text = "#353a41"
text_muted = "#656b74"
accent = "#345fc0"
border = "#d9dce0"
code_bg = "#eceef0"
selection = "#d9e3fc"

[extra.colours.dark]
# background = "#141619"
background = "#121416"
text_heading = "#eeeef0"
body_text = "#ccd0d5"
text_muted = "#989fa9"
accent = "#92aff1"
border = "#353940"
code_bg = "#202329"
selection = "#304675"
