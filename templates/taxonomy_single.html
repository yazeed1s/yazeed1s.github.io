{% extends "base.html" %}
{% block content %}
<header class="section-header">
    <a class="back-link" href="{{ get_url(path=taxonomy.name ~ '/') | safe }}">← {{ taxonomy.name | capitalize }}</a>
    <h1>{{ term.name }}</h1>
</header>
{% set pages = term.pages | sort(attribute="date") | reverse %}
{{<posts.list pages />}}
{% endblock content %}
